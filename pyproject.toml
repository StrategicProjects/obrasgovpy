[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obrasgovpy"
version = "0.1.0"
description = "Access the Brazilian federal government's ObrasGov open data API (pandas-friendly)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "André Leite", email = "leite@castlab.org" },
    { name = "Marcos Wasiliew", email = "marcos.wasiliew@gmail.com" },
    { name = "Hugo Vasconcelos", email = "hugo.vasconcelos@ufpe.br" },
    { name = "Carlos Amorim", email = "carlos.agaf@ufpe.br" },
    { name = "Diogo Bezerra", email = "diogo.bezerra@ufpe.br" },
    { name = "Júlia Nascimento Barreto", email = "juliabarreto@gd.seplag.pe.gov.br" },
]
keywords = [
    "ObrasGov",
    "Brazil",
    "infrastructure",
    "public-works",
    "open-data",
    "FastAPI",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.23", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/StrategicProjects/obrasgovpy"
Repository = "https://github.com/StrategicProjects/obrasgovpy"
Issues = "https://github.com/StrategicProjects/obrasgovpy/issues"
"R sibling" = "https://strategicprojects.github.io/obrasgovr/"
"API documentation" = "https://api-publica.obrasgov.gestao.gov.br/obras/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/obrasgovpy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
